name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-group.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-group.txt
      - name: Run independent and checkpoint tests
        run: python -m unittest discover -s tests -v
      - name: Run a parallel experiment with real exports
        run: python main.py --mode atlas --max-n 5 --workers 2 --output results/ci
      - name: Re-export the saved experiment
        run: python main.py --plot-only --output results/ci
      - name: Run generator backend with parallel exports
        run: python main.py --mode families --families grassmann johnson --grassmann 2,4,2 --johnson 7,3 --max-n 35 --backend bliss --workers 2 --timeout 15 --output results/ci-bliss
